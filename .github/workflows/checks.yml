# The gate. `docs/CONTRACT.md`: a provider is a Locutorium provider iff
# conformance/run.sh passes against it — so the suite is not a test job here,
# it is the specification being executed. Everything else is hygiene around it.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: scope
    runs-on: ubuntu-latest
    outputs:
      product: ${{ steps.diff.outputs.product }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        # conformance runs on macOS, which bills at ten times the Linux rate and
        # is the only expensive thing here. It exists to test the PRODUCT, so a
        # change that touches no product file does not need it. Doc-only and
        # CI-only pull requests were each paying four minutes of macOS to prove
        # something they could not have broken.
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if [ -z "$base" ]; then
            echo "product=true" >> "$GITHUB_OUTPUT"   # a push to main: always
            exit 0
          fi
          changed="$(git diff --name-only "$base" "$head")"
          echo "changed files:"; echo "$changed" | sed 's/^/  /'
          if echo "$changed" | grep -qE '^(bin/|lib/|cmd/|internal/|go\.(mod|sum)$|conformance/|providers/|install\.sh$|README\.md$)'; then
            echo "product=true" >> "$GITHUB_OUTPUT"
          else
            echo "product=false" >> "$GITHUB_OUTPUT"
            echo "no product files touched — conformance not warranted"
          fi

  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # check-version asks git whether HEAD is tagged
      - name: written for strangers
        run: bash conformance/check-clean.sh
      - name: one version, agreed everywhere
        run: bash conformance/check-version.sh
      - name: the suite speaks only to its own server
        run: bash conformance/check-scratch-only.sh
      - name: new-lines script self-test
        # Exercised on every run, whether or not there is Go in the tree,
        # since it needs no Go toolchain or coverage profile to check itself.
        run: python3 .github/scripts/new-lines-coverage.py --self-test

  go:
    name: go
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # the coverage comment is posted by the CI bot, not an agent
    steps:
      - uses: actions/checkout@v4
      - id: probe
        # There is no Go in the tree until the port lands. Skipping is correct;
        # failing would make every bash-only change red for no reason.
        run: |
          if [ -f go.mod ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "no go.mod yet — skipping"; fi
      - uses: actions/setup-go@v5
        if: steps.probe.outputs.present == 'true'
        with:
          go-version: '1.27'
          cache: true
      - name: build
        if: steps.probe.outputs.present == 'true'
        run: go build ./...
      - name: vet
        if: steps.probe.outputs.present == 'true'
        run: go vet ./...
      - name: test
        if: steps.probe.outputs.present == 'true'
        run: go test -cover -coverprofile=coverage.out ./... | tee /tmp/cov.txt

      # Reported, deliberately not gated. A coverage threshold gets satisfied by
      # writing tests that move a number; the gate here is the conformance suite,
      # which is the specification. This is for seeing what has no evidence
      # behind it, which is a different question from whether to merge.
      - name: coverage
        if: steps.probe.outputs.present == 'true'
        run: |
          {
            echo '## Go coverage'
            echo
            echo '```'
            grep 'coverage:' /tmp/cov.txt || true
            echo '```'
            echo
            echo '<details><summary>Functions below 100%</summary>'
            echo
            echo '```'
            go tool cover -func=coverage.out | awk '$3+0 < 100'
            echo '```'
            echo
            echo '</details>'
            echo
            echo '_Every package is gated by a floor just under its current figure._'
            echo 'The conformance suite is still the real gate; this is the narrower'
            echo 'question of which lines nothing has executed._'
          } >> "$GITHUB_STEP_SUMMARY"
          go tool cover -html=coverage.out -o coverage.html

      # A RATCHET, not a target. The floors are a little under what each
      # package measures today; the check is that they do not fall. Nobody
      # invented these numbers from a standard, so there is nothing to write a
      # pretend test toward — the only way to trip it is to remove coverage.
      #
      # Every package is gated now. An earlier version of this gated only two,
      # on the grounds that cmd/loc and internal/provider/nats were driven end
      # to end by the conformance suite and could not be unit-tested. That was
      # true of how they were WRITTEN, not of what was possible: cmd/loc called
      # os.Exit from leaf functions so nothing was reachable from a test, and
      # the provider had no in-process server to talk to. Both were fixed rather
      # than excused, and the exemption went with them.
      - name: coverage must not fall
        if: steps.probe.outputs.present == 'true'
        run: |
          fail=0
          # The per-package figure go test already printed. Averaging the
          # per-function percentages from `cover -func` is NOT package coverage
          # — it weights a one-line function the same as a hundred-line one.
          check() {           # <package> <floor>
            got=$(grep "locutorium/$1\b" /tmp/cov.txt | sed -n 's/.*coverage: \([0-9.]*\)% of statements.*/\1/p' | head -1)
            if [ -z "$got" ]; then
              echo "::error::no coverage figure for $1"; fail=1; return
            fi
            if awk -v g="$got" -v f="$2" 'BEGIN{exit !(g+0 < f+0)}'; then
              echo "::error::$1 coverage ${got}% is below its floor of $2%"; fail=1
            else
              echo "  $1: ${got}% (floor $2%)"
            fi
          }
          check cmd/loc                93
          check internal/config        98
          check internal/loc           88
          check internal/provider      95
          check internal/provider/nats 94
          exit $fail

      - name: keep the coverage report
        id: coverage-artifact
        if: steps.probe.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: |
            coverage.html
            coverage.out
          retention-days: 14

      - name: coverage total
        id: total
        if: steps.probe.outputs.present == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -o pipefail
          # Without pipefail a failing git diff in the pipeline below is masked: the script reads empty stdin, prints new=n/a and exits 0, so a broken measurement would read like a pull request with no Go lines.
          # The single project-wide figure, from the profile go test wrote.
          overall="$(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}')"
          echo "overall=$overall" >> "$GITHUB_OUTPUT"
          # new-lines percentage: only means anything on a pull request, where
          # there is a base commit to diff against. BASE_SHA travels through
          # env, never inline in the diff command, so a ref name can never
          # become a command.
          if [ -n "${BASE_SHA:-}" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            git diff -U0 "$BASE_SHA" HEAD -- '*.go' ':!*_test.go' | python3 .github/scripts/new-lines-coverage.py coverage.out >> "$GITHUB_OUTPUT"
          fi

      # Post the coverage headline onto the PR, so it is read without clicking
      # into the run. MECHANICAL: the github-actions bot posts a sticky comment
      # (updated in place each push), never an agent. Only on a pull request,
      # where there is a conversation to comment on.
      - name: comment coverage on the pull request
        if: github.event_name == 'pull_request' && steps.probe.outputs.present == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          COVERAGE_TITLE: 'Go coverage'
          COVERAGE_NOTE: 'Reported, not gated. The conformance suite is the gate; the per-package ratchet guards against coverage falling.'
          COVERAGE_OVERALL: ${{ steps.total.outputs.overall }}
          COVERAGE_NEW: ${{ steps.total.outputs.new }}
          COVERAGE_ARTIFACT_URL: ${{ steps.coverage-artifact.outputs.artifact-url }}
        with:
          script: |
            const marker = '<!-- ci-coverage -->';
            const title = process.env.COVERAGE_TITLE || 'n/a';
            const note = process.env.COVERAGE_NOTE || 'n/a';
            const overall = process.env.COVERAGE_OVERALL || 'n/a';
            const newpct = process.env.COVERAGE_NEW || 'n/a';
            const artUrl = process.env.COVERAGE_ARTIFACT_URL;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const lines = [
              marker,
              `### ${title}`,
              '',
              `**Overall:** ${overall}`,
              `**New code:** ${newpct}`,
              '',
              `- [Coverage on the run summary](${runUrl}) — per-package table and the functions below 100%`,
              artUrl ? `- [Downloadable HTML report](${artUrl}) — line-level, opens locally (a zip)` : '- HTML report: see the run artifacts',
              '',
              `_${note}_`,
            ];
            const body = lines.join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.user && c.user.type === 'Bot' && c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  conformance:
    name: conformance
    needs: scope
    if: needs.scope.outputs.product == 'true'
    # macOS on purpose: the suite drives BSD `sed -i ''` and `ps -o lstart=`,
    # and the pidfile's second line is that exact BSD string by contract. A
    # Linux runner would not be testing the thing this house actually ships.
    runs-on: [self-hosted, macOS]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: the medium
        run: |
          brew install nats-server
          brew install nats-io/nats-tools/nats
      - name: the suite is the specification
        # It boots its own server on a random port in its own temp LOC_HOME and
        # tears both down, so nothing here needs a service or a fixture.
        run: bash conformance/run.sh
