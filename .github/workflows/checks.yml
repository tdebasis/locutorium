# The gate. `docs/CONTRACT.md`: a provider is a Locutorium provider iff
# conformance/run.sh passes against it — so the suite is not a test job here,
# it is the specification being executed. Everything else is hygiene around it.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A pull request's run is superseded by its next push, so it cancels. A push to main never
# does: every commit on main shipped and needs its own verdict (#59). Each
# push to main is its own group. Grouping main pushes together and turning cancel-in-progress
# off is not enough: GitHub still cancels a PENDING run when a newer one queues.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: scope
    runs-on: ubuntu-latest
    outputs:
      product: ${{ steps.diff.outputs.product }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        # conformance runs on macOS, which bills at ten times the Linux rate and
        # is the only expensive thing here. It exists to test the PRODUCT, so a
        # change that touches no product file does not need it. Doc-only and
        # CI-only pull requests were each paying four minutes of macOS to prove
        # something they could not have broken.
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if [ -z "$base" ]; then
            echo "product=true" >> "$GITHUB_OUTPUT"   # a push to main: always
            exit 0
          fi
          changed="$(git diff --name-only "$base" "$head")"
          echo "changed files:"; echo "$changed" | sed 's/^/  /'
          if echo "$changed" | grep -qE '^(bin/|lib/|cmd/|internal/|go\.(mod|sum)$|Makefile$|conformance/|providers/|install\.sh$|README\.md$)'; then
            echo "product=true" >> "$GITHUB_OUTPUT"
          else
            echo "product=false" >> "$GITHUB_OUTPUT"
            echo "no product files touched — conformance not warranted"
          fi

  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the whole history; no step here reads a tag
      - name: written for strangers
        run: bash conformance/check-clean.sh
      - name: the suite speaks only to its own server
        run: bash conformance/check-scratch-only.sh
      - name: new-lines script self-test
        # Exercised on every run, whether or not there is Go in the tree,
        # since it needs no Go toolchain or coverage profile to check itself.
        run: python3 .github/scripts/new-lines-coverage.py --self-test

  go:
    name: go
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # the coverage comment is posted by the CI bot, not an agent
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the tags are the version; git describe needs them
      - id: probe
        # There is no Go in the tree until the port lands. Skipping is correct;
        # failing would make every bash-only change red for no reason.
        run: |
          if [ -f go.mod ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "no go.mod yet — skipping"; fi
      - uses: actions/setup-go@v5
        if: steps.probe.outputs.present == 'true'
        with:
          go-version: '1.27'
          cache: true
      - name: build
        if: steps.probe.outputs.present == 'true'
        run: go build ./...

      - name: every platform still compiles
        # The build above runs for the runner's own platform only. A call that
        # does not exist on Windows therefore compiled green here for four days
        # (#86). This step builds the tree for every platform the project
        # claims, so the next such break is red on the pull request that makes
        # it. It is a compile and not a test: nothing platform-specific is
        # exercised until there is a runner for that platform.
        if: steps.probe.outputs.present == 'true'
        run: |
          set -euo pipefail
          for goos in windows linux darwin; do
            echo "== GOOS=$goos"
            GOOS="$goos" GOARCH=amd64 go build ./...
          done

      - name: the stamped binary
        id: stamped
        # `go build ./...` proves every package compiles; it does not produce the
        # thing that ships. The Makefile does, and it is the SAME command a
        # person runs by hand — so what CI keeps and what a contributor holds
        # are made the one way. The assertion is the point of the stamp: the
        # number is linked in from `git describe`, and the binary must answer it
        # from a directory that has nothing to do with the clone.
        if: steps.probe.outputs.present == 'true'
        run: |
          set -euo pipefail
          make build
          want="loc $(git describe --tags --dirty --always | sed 's/^v//')"
          got="$(cd / && "$GITHUB_WORKSPACE/build/bin/loc" version)"
          echo "from /: $got"
          if [ "$got" != "$want" ]; then
            echo "::error::the binary says '$got' from an unrelated directory; git describe says '$want'"
            exit 1
          fi
          echo "name=loc-$(go env GOOS)-$(go env GOARCH)" >> "$GITHUB_OUTPUT"

      - name: keep the binary
        # Named for the platform it was built for, because the artifact list is
        # where somebody goes looking for a build to try — and an unqualified
        # `loc` in that list tells them nothing about whether it will run.
        if: steps.probe.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stamped.outputs.name }}
          path: build/bin/loc
          retention-days: 14
      - name: vet
        if: steps.probe.outputs.present == 'true'
        run: go vet ./...
      - name: test
        if: steps.probe.outputs.present == 'true'
        run: |
          set -o pipefail
          go test -cover -coverprofile=coverage.out ./... | tee /tmp/cov.txt

      - name: the suite's own machinery
        # The teardown and the pre-run cleanup are tests OF the suite, not the
        # suite: they plant sleeping processes and boot no server, so they run
        # here on the hosted lane, and their counts are read from this log.
        if: steps.probe.outputs.present == 'true'
        run: |
          set -o pipefail
          bash conformance/teardown_test.sh | tee /tmp/teardown.txt
          grep -q 'teardown: 15 passed, 0 failed' /tmp/teardown.txt
          bash conformance/leftovers_test.sh | tee /tmp/leftovers.txt
          grep -q 'leftovers: 14 passed, 0 failed' /tmp/leftovers.txt

      # Reported, deliberately not gated. A coverage threshold gets satisfied by
      # writing tests that move a number; the gate here is the conformance suite,
      # which is the specification. This is for seeing what has no evidence
      # behind it, which is a different question from whether to merge.
      - name: coverage
        if: steps.probe.outputs.present == 'true'
        run: |
          {
            echo '## Go coverage'
            echo
            echo '```'
            grep 'coverage:' /tmp/cov.txt || true
            echo '```'
            echo
            echo '<details><summary>Functions below 100%</summary>'
            echo
            echo '```'
            go tool cover -func=coverage.out | awk '$3+0 < 100'
            echo '```'
            echo
            echo '</details>'
            echo
            echo '_Every package is gated by a floor just under its current figure._'
            echo 'The conformance suite is still the real gate; this is the narrower'
            echo 'question of which lines nothing has executed._'
          } >> "$GITHUB_STEP_SUMMARY"
          go tool cover -html=coverage.out -o coverage.html

      # A RATCHET, not a target. The floors are a little under what each
      # package measures today; the check is that they do not fall. Nobody
      # invented these numbers from a standard, so there is nothing to write a
      # pretend test toward — the only way to trip it is to remove coverage.
      #
      # Every package is gated now. An earlier version of this gated only two,
      # on the grounds that cmd/loc and internal/provider/nats were driven end
      # to end by the conformance suite and could not be unit-tested. That was
      # true of how they were WRITTEN, not of what was possible: cmd/loc called
      # os.Exit from leaf functions so nothing was reachable from a test, and
      # the provider had no in-process server to talk to. Both were fixed rather
      # than excused, and the exemption went with them.
      - name: coverage must not fall
        if: steps.probe.outputs.present == 'true'
        run: |
          fail=0
          # The per-package figure go test already printed. Averaging the
          # per-function percentages from `cover -func` is NOT package coverage
          # — it weights a one-line function the same as a hundred-line one.
          check() {           # <package> <floor>
            got=$(grep "locutorium/$1\b" /tmp/cov.txt | sed -n 's/.*coverage: \([0-9.]*\)% of statements.*/\1/p' | head -1)
            if [ -z "$got" ]; then
              echo "::error::no coverage figure for $1"; fail=1; return
            fi
            if awk -v g="$got" -v f="$2" 'BEGIN{exit !(g+0 < f+0)}'; then
              echo "::error::$1 coverage ${got}% is below its floor of $2%"; fail=1
            else
              echo "  $1: ${got}% (floor $2%)"
            fi
          }
          check cmd/loc                93
          check internal/config        98
          check internal/loc           88
          check internal/mcpserve      85
          check internal/provider      95
          # HELD AT 94 THROUGH THE REMOVALS PR (#74). V0 has no authentication
          # (R12), so the credential and access-list cases in this package went
          # with the feature they tested — see docs/DECISIONS.md entry 12. The
          # code that READS a refusal is still shipped, and refusal_test.go now
          # covers it directly instead. 94.9% measured.
          check internal/provider/nats 94
          exit $fail

      - name: keep the coverage report
        id: coverage-artifact
        if: steps.probe.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: |
            coverage.html
            coverage.out
          retention-days: 14

      - name: coverage total
        id: total
        if: steps.probe.outputs.present == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -o pipefail
          # Without pipefail a failing git diff in the pipeline below is masked: the script reads empty stdin, prints new=n/a and exits 0, so a broken measurement would read like a pull request with no Go lines.
          # The single project-wide figure, from the profile go test wrote.
          overall="$(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}')"
          echo "overall=$overall" >> "$GITHUB_OUTPUT"
          # new-lines percentage: only means anything on a pull request, where
          # there is a base commit to diff against. BASE_SHA travels through
          # env, never inline in the diff command, so a ref name can never
          # become a command.
          if [ -n "${BASE_SHA:-}" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            git diff -U0 "$BASE_SHA" HEAD -- '*.go' ':!*_test.go' | python3 .github/scripts/new-lines-coverage.py coverage.out >> "$GITHUB_OUTPUT"
          fi

      # Post the coverage headline onto the PR, so it is read without clicking
      # into the run. MECHANICAL: the github-actions bot posts a sticky comment
      # (updated in place each push), never an agent. Only on a pull request,
      # where there is a conversation to comment on.
      - name: comment coverage on the pull request
        if: github.event_name == 'pull_request' && steps.probe.outputs.present == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          COVERAGE_TITLE: 'Go coverage'
          COVERAGE_NOTE: 'Reported, not gated. The conformance suite is the gate; the per-package ratchet guards against coverage falling.'
          COVERAGE_OVERALL: ${{ steps.total.outputs.overall }}
          COVERAGE_NEW: ${{ steps.total.outputs.new }}
          COVERAGE_ARTIFACT_URL: ${{ steps.coverage-artifact.outputs.artifact-url }}
        with:
          script: |
            const marker = '<!-- ci-coverage -->';
            const title = process.env.COVERAGE_TITLE || 'n/a';
            const note = process.env.COVERAGE_NOTE || 'n/a';
            const overall = process.env.COVERAGE_OVERALL || 'n/a';
            const newpct = process.env.COVERAGE_NEW || 'n/a';
            const artUrl = process.env.COVERAGE_ARTIFACT_URL;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const lines = [
              marker,
              `### ${title}`,
              '',
              `**Overall:** ${overall}`,
              `**New code:** ${newpct}`,
              '',
              `- [Coverage on the run summary](${runUrl}) — per-package table and the functions below 100%`,
              artUrl ? `- [Downloadable HTML report](${artUrl}) — line-level, opens locally (a zip)` : '- HTML report: see the run artifacts',
              '',
              `_${note}_`,
            ];
            const body = lines.join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.user && c.user.type === 'Bot' && c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  conformance:
    name: conformance
    needs: scope
    if: needs.scope.outputs.product == 'true'
    # macOS on purpose: the suite drives BSD `sed -i ''` and `ps -o lstart=`,
    # and the pidfile's second line is that exact BSD string by contract. A
    # Linux runner would not be testing the thing this house actually ships.
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: environment carries no operator secrets
        # The job now runs in a person's own account under a launchd service,
        # not an ephemeral hosted sandbox — this step is the falsifier that the
        # service environment carries none of that person's credentials. It
        # runs on hosted runners too, where the environment is already bare and
        # this is a cheap no-op there.
        run: |
          set -euo pipefail
          names="$(env | cut -d= -f1 | sort)"
          echo "$names"
          # ACTIONS_* is GitHub's own runtime, present on hosted runners too —
          # it is not the operator's, so it is filtered out before matching.
          filtered="$(printf '%s\n' "$names" | grep -v '^ACTIONS_' || true)"
          # The built-in pattern: vendor prefixes and the generic credential words.
          # Deployment-specific prefixes are DEPLOYMENT DATA, not source (the same
          # rule as the cleanliness list): a self-hosted runner supplies its own in
          # LOC_AUDIT_EXTRA (an extended regex) from the runner's .env, and it is
          # appended here. The audit's own variable is excluded from the audit.
          pattern='^(ANTHROPIC_|SUPABASE_|OPENAI_|AWS_|GOOGLE_|ALPACA_|SLACK_|NATS_CREDS|HOMEBREW_GITHUB_API_TOKEN$|GH_TOKEN$|GITHUB_TOKEN$|NPM_TOKEN$)|SECRET|PASSWORD|PASSWD|TOKEN|CRED|API_KEY|PRIVATE_KEY|_KEY(_|$)'
          if [ -n "${LOC_AUDIT_EXTRA:-}" ]; then pattern="${pattern}|${LOC_AUDIT_EXTRA}"; fi
          offenders="$(printf '%s\n' "$filtered" | grep -v '^LOC_AUDIT_EXTRA$' | grep -E "$pattern" || true)"
          if [ -n "$offenders" ]; then
            echo "::error::operator credentials found in environment:"
            printf '%s\n' "$offenders"
            exit 1
          fi
      # The broker is embedded in the binary and `loc start` runs it, so no
      # server package is installed here. The nats CLI stays: the suite still
      # asserts stream state through it.
      - name: the medium (hosted image only)
        if: runner.environment == 'github-hosted'
        # A hosted image starts empty, so it installs its own tooling. A
        # self-hosted machine is somebody's computer: a job never installs,
        # upgrades or cleans anything there (2026-09-06: this very step
        # upgraded the operator's live server and ran a cleanup).
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
          HOMEBREW_NO_INSTALL_UPGRADE: '1'
        run: |
          brew install nats-io/nats-tools/nats
      - name: the medium is present
        # On every runner: the suite needs both binaries on PATH. Missing on a
        # self-hosted machine is a setup fault to fix by hand, reported loudly,
        # never repaired by the job.
        run: |
          set -euo pipefail
          for tool in nats python3; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error::$tool is not on PATH on this runner (${{ runner.environment }}); install it by hand, the job will not"
              exit 1
            fi
          done
          nats --version
      - name: leftovers from an earlier job
        # `cancel-in-progress` kills the step's shell, not what the suite
        # detached: the seats' listener loops and the scratch server. On a
        # hosted image they go with the machine, so there is nothing here to
        # reap and this is skipped on the same test the never-install step
        # uses. On a machine that stays they survive into this job, where the
        # listener census counts them and the registry and wake cases see a
        # second, stale attendance. The census is printed whatever it finds,
        # so the reason for a failure is where the log is already being read,
        # and the step fails if anything it named is still standing — a
        # poisoned job never runs.
        if: runner.environment == 'self-hosted'
        run: bash conformance/leftovers.sh reap

      - name: the Go toolchain (hosted image only)
        # Same rule as the medium two steps up: a hosted image starts empty and
        # installs its own tooling, a self-hosted machine is somebody's computer
        # and this job installs nothing there. macos-14 ships no Go, which is
        # what made the first hosted run red. The version matches the `go` job:
        # one version for one thing.
        if: runner.environment == 'github-hosted'
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      - name: the Go toolchain is present
        # The suite drives the built binary, so it needs a compiler. A self-hosted machine is
        # somebody's computer and this job installs nothing on it — the same
        # rule the medium keeps two steps up — so an absent toolchain is a setup
        # fault, reported by name and loudly, and never repaired by the job.
        run: |
          set -euo pipefail
          for tool in go make; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error::$tool is not on PATH on this runner (${{ runner.environment }}); install it by hand, the job will not"
              exit 1
            fi
          done
          go version
          make --version | head -1

      - name: the suite is the specification
        # ONE run, because there is one implementation. This job used to run the
        # whole suite twice — once per implementation — and the first run needed
        # no build because the shell tool was the checkout. The suite now drives
        # build/bin/loc, so the build comes first; LOC_BIN_DIR defaults there.
        # It boots its own server on a random port in its own temp LOC_HOME and
        # tears both down, so nothing here needs a service or a fixture.
        run: |
          set -euo pipefail
          make build
          bash conformance/run.sh
